services:
    mongo.db.catalog:
        restart: always
        image: mongo:8.0-rc
        container_name: mongo.db.catalog.container
        environment:
            MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
            MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
        ports:
            - "27030:27017"
        volumes:
            - mongo.db.catalog.volume:/data/db
    mongo.db.catalog.ui:
        restart: always
        image: mongo-express:1.0.2-20-alpine3.19
        container_name: mongo.db.catalog.ui
        ports:
            - 27032:8081
        environment:
            ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongo.db.catalog:27017/
            ME_CONFIG_BASICAUTH: false
    redis.db.basket:
        restart: always
        image: redis:7.0-alpine
        container_name: redis.db.container
        command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
        ports:
            - "6379:6379"
        volumes: 
            - redis.db.basket.volume:/data
    redis.db.basket.ui:
        image: rediscommander/redis-commander:latest
        restart: always
        container_name: redis.db.basket.ui.container
        ports:
            - "27033:8081"
        environment:
            REDIS_HOST: redis.db.basket
            REDIS_PORT: 6379
            REDIS_PASSWORD: ${REDIS_UI_PASSWORD}
            HTTP_USER: ${REDIS_UI_USERNAME}
    mongo.db.discount:
        restart: always
        image: mongo:8.0-rc
        container_name: mongo.db.discount.container
        environment:
            MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
            MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
        ports:
            - "27034:27017"
        volumes:
            - mongo.db.discount.volume:/data/db
    mongo.db.discount.ui:
        restart: always
        image: mongo-express:1.0.2-20-alpine3.19
        container_name: mongo.db.discount.ui
        ports:
            - 27036:8081
        environment:
            ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongo.db.discount:27017/
            ME_CONFIG_BASICAUTH: false
    sqlserver.db.order:
        image: mcr.microsoft.com/mssql/server:2022-latest
        container_name: sqlserver.db.order
        restart: always
        environment:
            SA_PASSWORD: ${SA_PASSWORD}
            ACCEPT_EULA: "Y"
        ports:
            - "1433:1433"
        volumes:
            - "sqlserver.db.order.volume:/var/opt/mssql"
    keycloak:
        restart: always
        container_name: keycloak
        image: quay.io/keycloak/keycloak:25.0
        command: start
        environment:
          KC_HOSTNAME_PORT: 8080
          KC_HOSTNAME_STRICT_BACKCHANNEL: false
          KC_HTTP_ENABLED: true
          KC_HOSTNAME_STRICT_HTTPS: false
          KC_HOSTNAME_STRICT: false
          KC_HEALTH_ENABLED: true
          KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
          KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
          KC_DB: postgres
          KC_DB_URL: jdbc:postgresql://postgres.db.keycloak/${POSTGRES_DB}
          KC_DB_USERNAME: ${POSTGRES_USER}
          KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
        ports:
          - "8080:8080"
        depends_on:
          - postgres.db.keycloak
    postgres.db.keycloak:
        restart: always
        image: postgres:16.2
        container_name: postgres.db.keycloak.container
        environment:
          POSTGRES_DB: ${POSTGRES_DB}
          POSTGRES_USER: ${POSTGRES_USER}
          POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        ports:
          - "5432:5432"
        volumes:
          - posrgres.db.keycloak.volume:/var/lib/postgresql/data
    postgres.db.keycloak.ui:
        restart: always
        image: dpage/pgadmin4
        container_name: postgres.db.keycloak.container.ui
        ports:
          - "8888:80"
        environment:
          PGADMIN_DEFAULT_EMAIL: user-name@domain-name.com
          PGADMIN_DEFAULT_PASSWORD: strong-password
        volumes:
          - posrgres.db.keycloak.ui.volume:/var/lib/pgadmin
    rabbitmq: 
        restart: always
        image: rabbitmq:3.13.7-management
        container_name: rabbitmq
        ports:
          - 5672:5672
          - 15672:15672
        environment:
            RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
            RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
        volumes:
          - rabbitmq_data:/var/lib/rabbitmq
    microservicecourse.basket.api:
        image: microservicecoursebasketapi
        build:
          context: .
          dockerfile: MicroserviceCourse.Basket.Api/Dockerfile
    microservicecourse.catalog.api:
        image: microservicecoursecatalogapi
        build:
          context: .
          dockerfile: MicroserviceCourse.Catalog.Api/Dockerfile
    microservicecourse.discount.api:
        image: microservicecoursediscountapi
        build:
          context: .
          dockerfile: MicroserviceCourse.Discount.Api/Dockerfile
    microservicecourse.file.api:
        image: microservicecoursefileapi
        build:
          context: .
          dockerfile: MicroserviceCourse.File.Api/Dockerfile
    microservicecourse.gateway:
        image: microservicecoursegateway
        build:
          context: .
          dockerfile: MicroserviceCourse.Gateway/Dockerfile
    microservicecourse.order.api:
        image: microservicecourseorderapi
        build:
          context: .
          dockerfile: MicroserviceCourse.Order.Api/Dockerfile
    microservicecourse.payment.api:
        image: microservicecoursepaymentapi
        build:
          context: .
          dockerfile: MicroserviceCourse.Payment.Api/Dockerfile
    microservicecourse.web:
        image: microservicecourseweb
        build:
          context: .
          dockerfile: MicroserviceCourse.Web/Dockerfile

volumes:
    mongo.db.catalog.volume:
    redis.db.basket.volume:    
    mongo.db.discount.volume:
    sqlserver.db.order.volume:
    posrgres.db.keycloak.volume:
    posrgres.db.keycloak.ui.volume:
    rabbitmq_data: